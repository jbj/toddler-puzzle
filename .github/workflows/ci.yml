name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install art check tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick

      - name: Resolve Chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=google-chrome" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=chromium" >> "$GITHUB_ENV"
            chromium --version
          else
            echo "::error::Neither google-chrome nor chromium is available; npm run shot needs a headless Chrome binary."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-screenshots
          path: .art/shots/
          if-no-files-found: warn
          retention-days: 7

  # The art-shots orphan branch exists only to host generated screenshots at stable raw URLs.
  # GitHub comments cannot render artifact zips inline, so the branch holds only images and
  # must never be merged into main.
  publish-screenshots:
    name: Publish screenshots
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      # This job fetches the artifact zip through the REST API and extracts it
      # with path junking. Avoid actions/download-artifact here because this
      # privileged job must not trust paths from pull-request code.
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Download and check screenshots
        id: shots
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloaded-shots shots.zip
          mkdir -p downloaded-shots

          artifact_id="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "puzzle-screenshots" and .expired == false) | .id' | head -n 1 || true)"
          if [ -z "$artifact_id" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > shots.zip

          # The verify job runs pull-request code, so the artifact is treated as
          # untrusted. Junking paths prevents zip entries from escaping the
          # download directory before git runs with write permissions.
          # unzip returns a warning status when any listed extension is absent,
          # so the filtered files below are the source of truth.
          unzip -j -o shots.zip '*.png' '*.jpg' '*.jpeg' '*.webp' -d downloaded-shots || true
          rm -f shots.zip

          shopt -s nocasematch
          kept=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            size="$(stat -c '%s' "$file")"
            mime="$(file --mime-type -b "$file" || true)"

            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\.(png|jpg|jpeg|webp)$ ]]; then
              rm -f "$file"
              continue
            fi
            if (( size > 5242880 )); then
              rm -f "$file"
              continue
            fi
            case "$mime" in
              image/png|image/jpeg|image/webp) ;;
              *)
                rm -f "$file"
                continue
                ;;
            esac
            if (( kept >= 40 )); then
              rm -f "$file"
              continue
            fi
            kept=$((kept + 1))
          done < <(find downloaded-shots -maxdepth 1 -type f -print0 | sort -z)

          if find downloaded-shots -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish screenshots to art-shots branch
        id: publish
        if: ${{ !cancelled() && steps.shots.outputs.present == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          destination="pr-${PR_NUMBER}"
          shots_dir="${GITHUB_WORKSPACE}/downloaded-shots"
          workdir="${GITHUB_WORKSPACE}/art-shots-work"

          # Two pull requests finishing at once both push to art-shots, so a
          # rejected push is expected rather than exceptional. Re-clone and
          # reapply rather than forcing, which would drop the other PR's shots.
          publish() {
            rm -rf "$workdir" || return 1
            set +e
            git ls-remote --exit-code --heads "$repo_url" art-shots >/dev/null 2>&1
            branch_status=$?
            set -e

            if [ "$branch_status" -eq 0 ]; then
              git clone --depth=1 --branch art-shots "$repo_url" "$workdir" || return 1
            else
              if [ "$branch_status" -ne 2 ]; then
                return 1
              fi
              git clone --depth=1 "$repo_url" "$workdir" || return 1
              pushd "$workdir" >/dev/null || return 1
              git switch --orphan art-shots || { popd >/dev/null; return 1; }
              git rm -rf . >/dev/null 2>&1 || true
              popd >/dev/null || return 1
            fi

            pushd "$workdir" >/dev/null || return 1
            git config user.name "github-actions[bot]" || { popd >/dev/null; return 1; }
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || { popd >/dev/null; return 1; }

            rm -rf "$destination" || { popd >/dev/null; return 1; }
            mkdir -p "$destination" || { popd >/dev/null; return 1; }

            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              cp "$file" "$destination/$name" || { popd >/dev/null; return 1; }
            done < <(find "$shots_dir" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0)

            git add -A "$destination" || { popd >/dev/null; return 1; }
            if git diff --cached --quiet; then
              echo "No screenshot changes to publish."
              popd >/dev/null || return 1
              return 0
            fi
            git commit -m "Update art shots for PR ${PR_NUMBER}" || { popd >/dev/null; return 1; }
            git push origin art-shots || { popd >/dev/null; return 1; }
            popd >/dev/null || return 1
          }

          for attempt in 1 2 3; do
            if publish; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; another run probably got there first. Retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish screenshots to the art-shots branch after three attempts."
          echo "published=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Comment on pull request
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          ART_SHOTS_PRESENT: ${{ steps.shots.outputs.present }}
          ART_SHOTS_PUBLISHED: ${{ steps.publish.outputs.published }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- art-shots -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const sha = process.env.HEAD_SHA;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const safeFilename = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}\.(png|jpg|jpeg|webp)$/i;

            function escapeMarkdown(text) {
              return text.replace(/([\\`*_{}\[\]()#+\-.!|>])/g, '\\$1');
            }

            function encodeUrlComponent(text) {
              return encodeURIComponent(text).replace(/[!'()*]/g, (character) =>
                `%${character.charCodeAt(0).toString(16).toUpperCase()}`
              );
            }

            function screenshotFiles(root) {
              if (!fs.existsSync(root)) return [];
              const files = [];
              for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
                if (entry.isFile() && safeFilename.test(entry.name)) {
                  files.push(entry.name);
                }
              }
              return files.sort((a, b) => a.localeCompare(b));
            }

            let body = `${marker}\n### Puzzle screenshots\n\nCommit: \`${sha}\`\n\n`;
            const present = process.env.ART_SHOTS_PRESENT === 'true';
            const published = process.env.ART_SHOTS_PUBLISHED === 'true';
            const files = present && published ? screenshotFiles('downloaded-shots') : [];

            if (!present) {
              body += `This run failed before screenshots were produced. See the [workflow run](${runUrl}) for details.\n`;
            } else if (!published) {
              body += `Screenshots were produced, but this run could not publish them to the \`art-shots\` branch. See the [workflow run](${runUrl}) for details.\n`;
            } else if (files.length === 0) {
              body += `Screenshots were produced, but none passed the publishing filename checks. See the [workflow run](${runUrl}) for details.\n`;
            } else {
              body += `The images below are published from the \`art-shots\` orphan branch, which holds only generated images and must never be merged into \`main\`.\n\n`;
              for (const file of files) {
                const label = escapeMarkdown(file);
                const encodedPath = encodeUrlComponent(file);
                const url = `https://raw.githubusercontent.com/${owner}/${repo}/art-shots/pr-${prNumber}/${encodedPath}?v=${encodeUrlComponent(sha)}`;
                body += `#### ${label}\n\n![${label}](${url})\n\n`;
              }
              body += `[Workflow run](${runUrl})\n`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-screenshots:
    name: Cleanup screenshots
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Remove screenshots from art-shots branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          destination="pr-${PR_NUMBER}"
          workdir="${GITHUB_WORKSPACE}/art-shots-cleanup"

          # Deleting the directory stops new comments from pointing at it. Git
          # history still retains old blobs; periodically re-orphan art-shots if
          # reclaiming that storage ever matters.
          set +e
          git ls-remote --exit-code --heads "$repo_url" art-shots >/dev/null 2>&1
          branch_status=$?
          set -e
          if [ "$branch_status" -eq 2 ]; then
            echo "No art-shots branch to clean up."
            exit 0
          fi
          if [ "$branch_status" -ne 0 ]; then
            echo "::error::Could not check for the art-shots branch."
            exit 1
          fi

          rm -rf "$workdir"
          git clone --depth=1 --branch art-shots "$repo_url" "$workdir"
          pushd "$workdir" >/dev/null

          if [ ! -d "$destination" ]; then
            echo "No screenshots for ${destination}."
            popd >/dev/null
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$destination"
          git add -A "$destination"
          if git diff --cached --quiet; then
            echo "No screenshot changes to clean up."
            popd >/dev/null
            exit 0
          fi
          git commit -m "Remove art shots for PR ${PR_NUMBER}"
          git push origin art-shots
          popd >/dev/null
