<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!--
    Farmyard. Big flat shapes, one strong thing in every quarter of the picture:
    a jigsaw piece is a rectangle cut from anywhere, so what matters is that no
    rectangle of the picture is only sky or only grass.
  -->
  <g id="scene">
    <!-- sky and ground -->
    <rect x="0" y="0" width="480" height="205" fill="#bfe6ff" />
    <rect x="0" y="188" width="480" height="172" fill="#8cc95c" />
    <rect x="0" y="188" width="480" height="34" fill="#6aa844" />
    <!-- a curved rise in the far field, so the horizon is not a ruled line -->
    <path d="M0 196 C70 172 140 176 200 194 C260 212 330 196 400 178 C430 170 460 176 480 186 L480 222 L0 222 Z" fill="#79b94e" />

    <!-- sun, top left -->
    <circle cx="58" cy="54" r="36" fill="#ffd63d" stroke="#e8a81c" stroke-width="5" />
    <g fill="#ffd63d">
      <rect x="50" y="-6" width="16" height="18" rx="8" />
      <rect x="50" y="96" width="16" height="18" rx="8" />
      <rect x="-4" y="46" width="18" height="16" rx="8" />
      <rect x="102" y="46" width="18" height="16" rx="8" />
    </g>

    <!-- clouds -->
    <g fill="#ffffff">
      <ellipse cx="186" cy="58" rx="44" ry="26" />
      <circle cx="158" cy="56" r="22" />
      <circle cx="212" cy="50" r="26" />
      <ellipse cx="300" cy="40" rx="34" ry="20" />
      <circle cx="326" cy="38" r="18" />
      <ellipse cx="446" cy="52" rx="34" ry="20" />
      <circle cx="418" cy="52" r="17" />
    </g>

    <!-- barn, middle right -->
    <rect x="248" y="124" width="132" height="106" fill="#d95a4e" stroke="#9c3a32" stroke-width="5" />
    <path d="M236 128 L314 70 L392 128 Z" fill="#8c3b3b" stroke="#6d2c2c" stroke-width="5" />
    <rect x="292" y="164" width="46" height="66" fill="#8c3b3b" stroke="#6d2c2c" stroke-width="5" />
    <rect x="262" y="146" width="26" height="26" fill="#ffe9a8" stroke="#9c3a32" stroke-width="4" />
    <rect x="344" y="146" width="26" height="26" fill="#ffe9a8" stroke="#9c3a32" stroke-width="4" />

    <!-- big tree, right edge -->
    <rect x="424" y="150" width="24" height="86" fill="#8a5a3b" />
    <circle cx="436" cy="126" r="48" fill="#43903f" />
    <circle cx="404" cy="150" r="30" fill="#4fa249" />
    <circle cx="468" cy="148" r="28" fill="#4fa249" />

    <!-- small tree, middle left -->
    <rect x="168" y="188" width="18" height="48" fill="#8a5a3b" />
    <circle cx="177" cy="168" r="40" fill="#4fa249" />
    <circle cx="150" cy="186" r="24" fill="#43903f" />
    <circle cx="204" cy="186" r="22" fill="#43903f" />

    <!-- cow, standing between the pond and the small tree -->
    <g stroke="#3b3b44" stroke-width="4">
      <rect x="26" y="196" width="86" height="44" rx="16" fill="#ffffff" />
      <rect x="20" y="182" width="34" height="30" rx="12" fill="#ffffff" />
      <rect x="34" y="236" width="12" height="20" fill="#3b3b44" />
      <rect x="90" y="236" width="12" height="20" fill="#3b3b44" />
    </g>
    <g fill="#3b3b44">
      <ellipse cx="76" cy="210" rx="17" ry="12" />
      <ellipse cx="52" cy="230" rx="13" ry="9" />
      <circle cx="30" cy="192" r="4" />
    </g>

    <!-- pond, bottom left -->
    <ellipse cx="66" cy="304" rx="70" ry="42" fill="#4f9fd4" stroke="#2f76a8" stroke-width="5" />
    <ellipse cx="46" cy="292" rx="26" ry="12" fill="#7dc0e8" />

    <!-- haystack, bottom middle -->
    <path d="M126 336 C126 292 150 264 184 264 C218 264 242 292 242 336 Z" fill="#e8c25b" stroke="#bd923a" stroke-width="5" />
    <path d="M136 308 C160 300 208 300 232 308" fill="none" stroke="#bd923a" stroke-width="5" />

    <!-- fence, bottom middle right -->
    <g fill="#a9764a" stroke="#7d5433" stroke-width="4">
      <rect x="256" y="268" width="16" height="76" />
      <rect x="304" y="268" width="16" height="76" />
      <rect x="352" y="268" width="16" height="76" />
      <rect x="248" y="282" width="128" height="14" />
      <rect x="248" y="314" width="128" height="14" />
    </g>

    <!-- flowers, bottom right -->
    <g stroke="#3d7b40" stroke-width="6" stroke-linecap="round">
      <path d="M404 344 L404 306" />
      <path d="M444 348 L444 296" />
      <path d="M466 344 L466 314" />
    </g>
    <circle cx="404" cy="298" r="17" fill="#ef6f8e" />
    <circle cx="444" cy="286" r="20" fill="#ffd63d" />
    <circle cx="466" cy="306" r="15" fill="#f2f2f2" />
    <circle cx="444" cy="286" r="7" fill="#e8a81c" />
  </g>
</svg>
