       C 172 60.41 184.5 65.16 189 79.41
       C 190.5 90.48 174 98.41 160.75 88.89
       C 160.75 98.41 156.88 106.31 149.77 111.9
       C 159.7 116.86 172.24 126.36 178.5 141.12
       C 184.77 155.9 182.68 170.67 174.32 181.22
       L 174.32 200.21
       Q 174.32 214.98 161.79 214.98
       Q 149.26 214.98 149.26 200.21
       L 149.26 185.43
