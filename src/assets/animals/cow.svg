    <ellipse cx="120.0" cy="95.76" rx="26.64" ry="12.66" fill="#f0c3c6" />
    <ellipse cx="109.55" cy="94.71" rx="3.97" ry="4.75" fill="#a8797c" />
    <ellipse cx="130.45" cy="94.71" rx="3.97" ry="4.75" fill="#a8797c" />
