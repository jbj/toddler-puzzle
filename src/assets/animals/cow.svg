<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Cow, facing the camera. Head first: the horns and the ears are cut into the
    outline rather than painted on, so the head is still a cow's head at the
    size a hole is cut at. The body is that same path opened out at the cheeks
    and carried down into the barrel and two front legs. Tall and narrow on
    purpose - the pig it shares the farm with is low, wide and side-on.
  -->
  <path
    id="silhouette"
    fill="#fbf7ef"
    stroke="#7c7368"
    stroke-width="5"
    stroke-linejoin="round"
    d="M 120 27
       C 128 27 134 30 137 35
       C 145 27 154 22 162 21
       C 169 21 170 27 168 33
       C 164 41 158 46 149 49
       C 157 54 161 60 162 68
       C 172 60 184 65 189 79
       C 190 90 174 98 161 89
       C 161 98 157 106 150 112
       C 160 117 172 126 178 141
       C 185 156 183 171 174 181
       L 174 200
       Q 174 215 162 215
       Q 149 215 149 200
       L 149 185
       C 137 194 103 194 91 185
       L 91 200
       Q 91 215 78 215
       Q 66 215 66 200
       L 66 181
       C 57 171 55 156 62 141
       C 68 126 80 117 90 112
       C 83 106 79 98 79 89
       C 66 98 50 90 51 79
       C 56 65 68 60 78 68
       C 79 60 83 54 91 49
       C 82 46 76 41 72 33
       C 70 27 71 21 78 21
       C 86 22 95 27 103 35
       C 106 30 112 27 120 27
       Z"
  />
  <g id="detail">
    <!-- inner ears -->
    <ellipse cx="172" cy="80" rx="10" ry="6" fill="#e0d6c6" transform="rotate(14 172 80)" />
    <ellipse cx="68" cy="80" rx="10" ry="6" fill="#e0d6c6" transform="rotate(-14 68 80)" />
    <!-- eyes -->
    <circle cx="104" cy="69" r="9" fill="#2b3440" />
    <circle cx="136" cy="69" r="9" fill="#2b3440" />
    <!-- muzzle -->
    <ellipse cx="120" cy="96" rx="27" ry="13" fill="#f0c3c6" />
    <ellipse cx="110" cy="95" rx="4" ry="5" fill="#a8797c" />
    <ellipse cx="130" cy="95" rx="4" ry="5" fill="#a8797c" />
    <!-- body patches -->
    <path
      d="M 153 131 C 168 133 174 148 167 158 C 160 169 143 166 139 154 C 135 142 142 128 153 131 Z"
      fill="#3f4650"
    />
    <path
      d="M 76 150 C 89 148 95 158 91 169 C 87 177 72 177 68 166 C 65 158 68 152 76 150 Z"
      fill="#3f4650"
    />
    <path
      d="M 120 160 C 130 158 139 166 135 175 C 130 182 118 182 114 175 C 111 168 114 161 120 160 Z"
      fill="#3f4650"
    />
    <!-- hooves, following the silhouette's own toes -->
    <g fill="#7c7368">
      <path d="M 149 200 Q 149 215 162 215 Q 174 215 174 200 Z" />
      <path d="M 66 200 Q 66 215 78 215 Q 91 215 91 200 Z" />
    </g>
  </g>
</svg>
