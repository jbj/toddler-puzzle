<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Cow, facing the camera. Head first: the horns and the ears are cut into the
    outline rather than painted on, so the head is still a cow's head at the
    size a hole is cut at. The body is that same path opened out at the cheeks
    and carried down into the barrel and two front legs. Tall and narrow on
    purpose - the pig it shares the farm with is low, wide and side-on.
  -->
