       C 67.76 126.36 80.3 116.86 90.23 111.9
       C 83.22 106.31 79.25 98.41 79.25 88.89
       C 66 98.41 49.5 90.48 51 79.41
       C 55.5 65.16 68 60.41 78.52 68.33
       C 79.25 60.41 83.22 54.1 91.06 49.33
       C 82.39 46.18 76.12 41.43 72.26 32.78
       C 69.85 27.19 71.42 20.86 77.68 20.86
       C 85.52 22.45 94.92 27.19 102.76 35.11
       C 105.9 30.36 112.16 27.19 120 27.19
       Z"
  />
  <g id="detail">
    <!-- inner ears -->
    <ellipse cx="172.2" cy="79.58" rx="10.5" ry="6.53" fill="#e0d6c6" transform="rotate(14 172.2 79.58)" />
    <ellipse cx="67.8" cy="79.58" rx="10.5" ry="6.53" fill="#e0d6c6" transform="rotate(-14 67.8 79.58)" />
    <!-- eyes -->
    <circle cx="104.33" cy="69.38" r="8.8" fill="#2b3440" />
    <circle cx="135.67" cy="69.38" r="8.8" fill="#2b3440" />
