<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Cow, facing left. Tall on long legs with the head carried high on a neck,
    which is what keeps it apart from the pig it shares the farm with. The two
    horns are part of the outline, not a mark inside it, so they survive at the
    size a hole is cut at.
  -->
  <path
    id="silhouette"
    fill="#fbf7ef"
    stroke="#7c7368"
    stroke-width="5"
    stroke-linejoin="round"
    d="M26 46
       C30 36 42 38 44 50
       C50 44 58 44 62 50
       C66 38 78 36 82 46
       C90 48 102 52 104 62
       C104 72 94 76 88 74
       C97 86 105 96 110 108
       C142 104 176 112 194 132
       C208 146 208 156 200 162
       L200 202 Q200 212 190 212 Q180 212 180 202 L180 166
       L166 168
       L166 202 Q166 212 156 212 Q146 212 146 202 L146 164
       C126 168 108 168 96 164
       L96 202 Q96 212 86 212 Q76 212 76 202 L76 160
       L64 158
       L64 202 Q64 212 54 212 Q44 212 44 202 L44 154
       C32 146 28 136 34 126
       C46 118 56 112 60 102
       C52 101 42 100 34 96
       C24 91 20 82 20 72
       C20 58 23 50 26 46 Z"
  />
  <g id="detail">
    <!-- muzzle -->
    <ellipse cx="44" cy="78" rx="14" ry="12" fill="#f0c3c6" stroke="#7c7368" stroke-width="4" />
    <circle cx="38" cy="74" r="3.5" fill="#a8797c" />
    <circle cx="38" cy="85" r="3.5" fill="#a8797c" />
    <!-- eye -->
    <circle cx="54" cy="57" r="7" fill="#2b3440" />
    <!-- inner ear, inside the lobe the outline already carries -->
    <ellipse cx="94" cy="62" rx="6" ry="7" fill="#e0d6c6" transform="rotate(20 94 62)" />
    <!-- patches -->
    <path
      d="M120 116 C136 108 156 112 162 126 C166 138 154 148 138 146
         C122 144 112 128 120 116 Z"
      fill="#3f4650"
    />
    <path
      d="M178 134 C190 134 198 142 196 152 C194 160 184 162 178 156
         C172 148 172 138 178 134 Z"
      fill="#3f4650"
    />
    <path
      d="M96 136 C108 134 116 143 112 152 C106 160 94 160 90 152 C86 143 90 138 96 136 Z"
      fill="#3f4650"
    />
    <!-- hooves -->
    <g fill="none" stroke="#7c7368" stroke-width="9" stroke-linecap="round" opacity="0.5">
      <path d="M52 202 h4" />
      <path d="M84 202 h4" />
      <path d="M154 202 h4" />
      <path d="M188 202 h4" />
    </g>
    <!-- tail with a tuft, budgeted overhang -->
    <path
      d="M203 144 C213 154 216 172 212 186"
      fill="none"
      stroke="#7c7368"
      stroke-width="5"
      stroke-linecap="round"
      data-overhang="tail"
    />
    <circle cx="211" cy="190" r="8" fill="#3f4650" data-overhang="tail" />
  </g>
</svg>
