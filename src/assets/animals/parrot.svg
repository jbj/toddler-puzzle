<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Parrot, facing left. The hooked beak and the long tail sweeping down to the
    right are both in the outline, which is what separates it from the jungle's
    other flier, the butterfly. The dip behind the head is deliberate: without a
    neck the beak reads as a lump stuck on a ball.
  -->
  <path
    id="silhouette"
    fill="#e2584c"
    stroke="#a8382f"
    stroke-width="5"
    stroke-linejoin="round"
    d="M88 30
       C112 30 128 48 128 72
       C124 84 116 90 108 94
       C138 100 164 118 176 142
       C192 152 208 170 212 190
       C202 197 188 192 178 182
       C170 176 160 170 152 164
       C142 178 124 188 106 190
       L106 198 Q106 206 96 206 Q86 206 86 198 L86 190
       L70 190
       L70 198 Q70 206 60 206 Q50 206 50 198 L50 186
       C40 178 36 162 40 148
       C34 136 34 120 42 110
       C50 106 56 104 60 100
       C50 98 40 92 34 84
       C26 76 26 62 34 54
       C44 46 58 46 64 52
       C68 40 76 30 88 30 Z"
  />
  <g id="detail">
    <!-- hooked beak -->
    <path
      d="M67 55 C57 48 44 51 38 60 C32 70 34 80 40 87 C46 93 53 96 59 95
         C55 82 60 62 70 50 Z"
      fill="#f3e6c8"
      stroke="#a8382f"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <circle cx="56" cy="62" r="3.5" fill="#c2b596" />
    <!-- eye -->
    <circle cx="92" cy="64" r="7.5" fill="#2b3440" />
    <!-- wing -->
    <path
      d="M96 116 C124 108 150 126 154 150 C156 166 140 176 122 169
         C102 161 90 136 96 116 Z"
      fill="#f2c14e"
    />
    <path
      d="M108 130 C126 128 142 140 146 154"
      fill="none"
      stroke="#d79f2f"
      stroke-width="5"
      stroke-linecap="round"
    />
    <!-- tail feathers -->
    <g fill="none" stroke="#a8382f" stroke-width="4.5" stroke-linecap="round" opacity="0.65">
      <path d="M178 148 C190 162 198 176 202 188" />
      <path d="M166 156 C176 166 182 176 186 184" />
    </g>
    <!-- feet -->
    <g fill="none" stroke="#c9903a" stroke-width="9" stroke-linecap="round">
      <path d="M58 198 h4" />
      <path d="M94 198 h4" />
    </g>
  </g>
</svg>
