<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Pig, facing left. Low, wide and short-legged on purpose: it shares the farm
    with the cow, and the two have to read differently at tray size, so the pig
    is a long barrel close to the ground and the cow stands tall. The face runs
    straight into the back in one line, the way a pig's does.
  -->
  <path
    id="silhouette"
    fill="#f2adbb"
    stroke="#c47b8e"
    stroke-width="5"
    stroke-linejoin="round"
    d="M22 128
       C22 106 40 88 66 82
       C96 70 150 74 176 96
       C198 114 200 146 188 164
       L188 190 Q188 198 178 198 Q168 198 168 190 L168 170
       L156 172
       L156 190 Q156 198 146 198 Q136 198 136 190 L136 170
       C122 174 106 174 94 170
       L94 190 Q94 198 84 198 Q74 198 74 190 L74 168
       L64 166
       L64 190 Q64 198 54 198 Q44 198 44 190 L44 162
       C32 156 22 144 22 128 Z"
  />
  <g id="detail">
    <!-- snout -->
    <ellipse cx="43" cy="131" rx="13" ry="15" fill="#e8919f" stroke="#c47b8e" stroke-width="4" />
    <circle cx="40" cy="125" r="3.5" fill="#a8596c" />
    <circle cx="40" cy="138" r="3.5" fill="#a8596c" />
    <!-- eye -->
    <circle cx="66" cy="112" r="7" fill="#2b3440" />
    <!-- ear, behind and above the eye where it does not cover the face -->
    <path
      d="M78 96 C82 82 96 78 104 86 C106 98 96 110 84 112 C78 112 76 104 78 96 Z"
      fill="#e8919f"
      stroke="#c47b8e"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <!-- trotters -->
    <g fill="none" stroke="#c47b8e" stroke-width="9" stroke-linecap="round" opacity="0.55">
      <path d="M50 188 h8" />
      <path d="M80 188 h8" />
      <path d="M142 188 h8" />
      <path d="M174 188 h8" />
    </g>
    <!-- curly tail, budgeted overhang -->
    <path
      d="M192 130 C206 124 212 134 206 142 C200 150 208 158 216 152"
      fill="none"
      stroke="#c47b8e"
      stroke-width="6"
      stroke-linecap="round"
      data-overhang="tail"
    />
  </g>
</svg>
