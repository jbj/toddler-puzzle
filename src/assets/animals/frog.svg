<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Frog, seen from the front and symmetric about the middle. Two eyes bulging
    over the top of the head, a squat body, and a folded back leg on each side
    whose webbed foot spreads out well past the belly, three toes along it.
  -->
  <path
    id="silhouette"
    fill="#7bc043"
    stroke="#3f7a1f"
    stroke-width="5"
    stroke-linejoin="round"
    d="M120 64
       C124 42 134 34 148 36
       C164 38 170 52 166 68
       C182 74 192 88 194 104
       C212 104 226 120 226 142
       C226 160 216 174 204 180
       C216 180 228 186 230 196
       Q232 206 222 204
       Q212 212 202 202
       Q192 212 182 202
       C176 198 172 192 168 186
       C160 196 142 200 120 200
       C98 200 80 196 72 186
       C68 192 64 198 58 202
       Q48 212 38 202
       Q28 212 18 204
       Q8 206 10 196
       C12 186 24 180 36 180
       C24 174 14 160 14 142
       C14 120 28 104 46 104
       C48 88 58 74 74 68
       C70 52 76 38 92 36
       C106 34 116 42 120 64 Z"
  />
  <g id="detail">
    <!-- pale belly -->
    <ellipse cx="120" cy="152" rx="40" ry="28" fill="#e8f4c8" />
    <!-- eyes -->
    <circle cx="144" cy="52" r="11" fill="#2b3440" />
    <circle cx="96" cy="52" r="11" fill="#2b3440" />
    <!-- nostrils -->
    <circle cx="110" cy="84" r="3.5" fill="#3f7a1f" />
    <circle cx="130" cy="84" r="3.5" fill="#3f7a1f" />
    <!-- mouth -->
    <path
      d="M78 98 C96 130 144 130 162 98"
      fill="none"
      stroke="#3f7a1f"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>
