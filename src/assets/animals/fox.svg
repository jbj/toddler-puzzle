<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Fox, facing left. Two sharp ears and a tail nearly as big as the body,
    which is what keeps the outline apart from the other four-legged animals.
  -->
  <path
    id="silhouette"
    fill="#ef8b3c"
    stroke="#b3541e"
    stroke-width="5"
    stroke-linejoin="round"
    d="M26 96
       C34 78 44 66 58 58
       L52 26
       L84 50
       L96 24
       L108 62
       C130 70 150 84 162 104
       C172 88 186 72 192 54
       C196 38 220 36 228 52
       C236 70 226 114 204 134
       C194 142 184 148 176 152
       C178 162 176 170 172 176
       L176 210 Q176 218 166 218 Q156 218 156 210 L152 174
       C142 178 130 178 120 176
       L124 210 Q124 218 114 218 Q104 218 104 210 L100 172
       C90 168 84 158 84 146
       C82 128 76 114 62 108
       C48 106 34 102 26 96 Z"
  />
  <g id="detail">
    <!-- muzzle and cheek -->
    <path
      d="M30 96 C38 80 48 70 60 63 C70 76 74 92 72 106
         C58 108 42 102 30 96 Z"
      fill="#fbf3e6"
    />
    <!-- chest -->
    <path
      d="M80 116 C84 130 86 144 86 150 C88 160 94 168 100 172
         C105 169 109 165 112 161 C98 149 90 134 90 116 Z"
      fill="#fbf3e6"
    />
    <!-- inner ears -->
    <path d="M57 36 L76 51 L64 57 Z" fill="#8c3d18" />
    <path d="M94 34 L86 54 L102 58 Z" fill="#8c3d18" />
    <!-- tail tip -->
    <path
      d="M200 56 C206 44 222 43 227 55 C232 68 230 88 222 106
         C212 100 202 88 198 76 C196 68 197 61 200 56 Z"
      fill="#fbf3e6"
    />
    <!-- eye -->
    <circle cx="66" cy="80" r="6" fill="#2b3440" />
    <!-- nose -->
    <circle cx="33" cy="93" r="7" fill="#2b3440" />
  </g>
</svg>
