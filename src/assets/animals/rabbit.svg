<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Rabbit, sitting, facing left. Two tall ears, a round haunch, and a bobtail
    that is allowed past the outline on purpose.
  -->
  <path
    id="silhouette"
    fill="#efe7dc"
    stroke="#a4907c"
    stroke-width="5"
    stroke-linejoin="round"
    d="M80 96
       C76 70 62 34 48 14
       C42 6 34 12 34 26
       C34 50 42 82 56 104
       C44 108 34 122 32 140
       C30 160 36 186 52 202
       C57 207 62 212 70 212
       L152 212
       C180 212 202 201 209 178
       C216 154 204 122 176 104
       C148 88 116 88 104 102
       C108 76 106 38 102 16
       C100 8 92 8 88 18
       C82 38 80 68 80 96 Z"
  />
  <g id="detail">
    <!-- haunch -->
    <path
      d="M108 180 C108 156 128 144 152 144 C176 144 188 158 188 180
         C188 196 176 203 160 203 L136 203 C118 203 108 196 108 180 Z"
      fill="#ded2c2"
    />
    <!-- left ear, inner -->
    <path d="M73 93.3 C67.3 72.1 57.8 45.3 48.9 25.7 Q42.6 26 38.6 32.8 C42.3 53.3 49.9 78.6 59.2 98 Q67 98.3 73 93.3 Z" fill="#f2b7c5" />
    <!-- right ear, inner -->
    <path d="M98.7 95.7 C100.8 73.4 100.4 45.7 99.2 25.6 Q94.6 22.4 89.7 26.1 C87.2 44.8 86.2 69.6 85.4 92.3 Q92 96.7 98.7 95.7 Z" fill="#f2b7c5" />
    <!-- eyes -->
    <circle cx="49" cy="126" r="8.5" fill="#2b3440" />
    <circle cx="86" cy="126" r="8.5" fill="#2b3440" />
    <!-- nose -->
    <path d="M60.5 141 C64.5 138.5 70.5 138.5 74 141 C74 148 69.5 154 67.2 154 C64.9 154 60.5 148 60.5 141 Z" fill="#f2b7c5" />
    <!-- mouth -->
    <path
      d="M67.2 154 L67.2 158.5 M67.2 158.5 C67.2 163.5 64 165 62.5 162.5 M67.2 158.5 C67.2 163.5 70.4 165 72 162.5"
      fill="none"
      stroke="#a4907c"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- tail, budgeted overhang -->
    <circle
      cx="209"
      cy="151"
      r="16"
      fill="#fffaf2"
      stroke="#a4907c"
      stroke-width="4"
      data-overhang="tail"
    />
  </g>
</svg>
